name: Release

# Pushing a `vX.Y.Z` tag builds the distributions and publishes them as a
# GitHub Release. Nothing is published outside this (private) repository:
# install with `gh release download` + `pip install`, see README "Releasing".
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ancestry check below needs the history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Branch protection is unavailable on this plan, so this is what keeps a
      # release from being cut off an unreviewed branch.
      - name: Tag must point at a commit on main
        run: |
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit on main — releases are cut from main only (CLAUDE.md, Git workflow)."
            exit 1
          fi

      # Read the version textually: importing the package would pull in
      # netmiko/pandas before the dependencies are installed.
      - name: Tag must match the package version
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' iftriage/__init__.py)"
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match iftriage.__version__ ($version)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Fail closed: an undocumented release is a process error, not a release
      # with empty notes.
      - name: Extract release notes from the changelog
        run: |
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { collecting = 1; next }
            /^## \[/ { collecting = 0 }
            collecting { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION — close [Unreleased] as [$VERSION] before tagging."
            exit 1
          fi

      - name: Build distributions
        run: |
          python -m pip install --quiet --upgrade build
          python -m build

      # The artifact, not the checkout, is what gets installed on an operator
      # machine — exercise it the same way, from outside the source tree.
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          cd /tmp
          reported="$(/tmp/smoke/bin/iftriage --version)"
          if [ "$reported" != "iftriage $VERSION" ]; then
            echo "::error::Installed wheel reports '$reported', expected 'iftriage $VERSION'."
            exit 1
          fi
          /tmp/smoke/bin/python -c "
          from importlib.resources import files
          assert (files('iftriage') / 'templates' / 'report_en.html.j2').is_file()
          "

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "iftriage $VERSION" \
            --notes-file release-notes.md \
            dist/*
