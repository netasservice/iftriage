[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "iftriage"
dynamic = ["version"]
description = "Read-only interface error triage for Splunk top-N delta reports"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "netmiko>=4.3",
    "pandas>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
iftriage = "iftriage.cli:main"

# Single source of truth for the version: the release workflow compares the tag
# against this same attribute.
[tool.setuptools.dynamic]
version = { attr = "iftriage.__version__" }

[tool.setuptools.packages.find]
include = ["iftriage*"]

[tool.setuptools.package-data]
iftriage = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["netmiko.*", "pandas.*", "yaml.*"]
ignore_missing_imports = true
